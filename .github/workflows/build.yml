name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Логика подготовки инстанса живёт в лаунчере: слияние профилей Mojang и
      # Fabric и дедупликация classpath (регресс на «duplicate ASM classes»).
      # Зависимости npm для этого не нужны — тесты на встроенном node:test.
      - name: Test launcher profile merge
        working-directory: launcher
        run: node --test test/profile-merge.test.js

      - name: Build with Gradle
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build_output.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "Gradle failed (exit $rc). Extracting key error lines:"
            grep -n -E "FAILURE:|What went wrong|Caused by:|error:|Execution failed for task" build_output.log | head -8 | while IFS= read -r line; do
              echo "::error title=Gradle error::$line"
            done
            if ! grep -q -E "FAILURE:|What went wrong|Caused by:|error:|Execution failed for task" build_output.log; then
              tail -n 12 build_output.log | while IFS= read -r line; do
                echo "::error title=Gradle tail::$line"
              done
            fi
            exit 1
          fi
        env:
          TERM: dumb
